spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE:wonnie}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:wonnie}
    password: ${MYSQL_PASSWORD:wonnie}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:wonnie}
    password: ${RABBITMQ_DEFAULT_PASS:wonnie}

app:
  messaging:
    enabled: true
