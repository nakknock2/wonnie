spring:
  session:
    store-type: none
  datasource:
    url: jdbc:h2:mem:wonnie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    locations: classpath:db/migration-h2
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    listener:
      simple:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

app:
  finance:
    demo-alert-endpoint-enabled: true
