spring:
  datasource:
    url: jdbc:h2:mem:woonie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    listener:
      simple:
        auto-startup: false
