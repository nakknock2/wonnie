spring:
  application:
    name: wonnie-api
  profiles:
    default: local
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    mcp:
      client:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        type:
          java_time_use_direct_jdbc: true
  flyway:
    enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  finance:
    demo-alert-endpoint-enabled: false
    demo-data-enabled: true
  auth:
    frontend-url: http://localhost:5173
  messaging:
    enabled: false
