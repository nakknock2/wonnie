<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>우리WON뱅킹 · WONNIE 스플래시</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="splash" aria-label="우리WON뱅킹 시작 화면">
    <section class="campaign" aria-label="2026 우리금융 다함께 페스타">
      <!-- The supplied photograph provides only the original campaign artwork.
           SVG viewBox clips the artwork without flattening the app screen. -->
      <svg class="campaign-logo" viewBox="285 659 452 322" role="img" aria-label="2026 우리금융 다함께 페스타">
        <image href="assets/splash-reference.png" width="970" height="1963"/>
      </svg>
      <img class="wonnie" src="assets/wonnie-leaning.png" alt="페스타 글자 위에 두 팔을 얹고 웃는 워니" draggable="false">
      <p class="campaign-message">우리와 손잡는 순간,<br>비교할 수 없는 역대급 혜택이 펼쳐집니다</p>
    </section>
    <footer class="brand-footer">
      <svg class="accessibility" viewBox="376 1610 270 92" role="img" aria-label="Mobile Accessibility 모바일 접근성 인증 — 원본 화면 표기">
        <image href="assets/splash-reference.png" width="970" height="1963"/>
      </svg>
      <svg class="bank-logo" viewBox="437 1787 148 52" role="img" aria-label="우리은행">
        <image href="assets/splash-reference.png" width="970" height="1963"/>
      </svg>
    </footer>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>

</body>
</html>
